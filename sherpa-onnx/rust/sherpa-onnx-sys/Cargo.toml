[package]
name = "sherpa-onnx-sys"
version = "1.13.7"
edition = "2021"
description = "Raw FFI bindings to the sherpa-onnx C API"
license = "Apache-2.0"
repository = "https://github.com/k2-fsa/sherpa-onnx"
readme = "README.md"
links = "sherpa-onnx"

keywords = ["ffi", "speech", "sherpa-onnx", "bindings"]
categories = ["external-ffi-bindings"]

include = [
    "src/**",
    "build.rs",
    "build_support/**",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[features]
default = ["static"]
static = []
shared = []

[build-dependencies]
bzip2 = "0.4"
# `ring` matches the crypto provider that ureq links, so the build script does
# not pull in a second one (rustls panics when it cannot pick between them).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
tar = "0.4"
ureq = { version = "2.12", features = ["proxy-from-env"] }
webpki-roots = "0.26"
zip = "2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[package.metadata.docs.rs]
default-features = false
features = []
