  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-win-arm64-1.13.6.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-win-arm64 -Dversion=1.13.6 -Dpackaging=jar -DgeneratePom=true
