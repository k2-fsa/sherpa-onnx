jdk:
  - openjdk17

before_install:
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-jvm-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-linux-aarch64-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-linux-x64-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-osx-aarch64-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-osx-x64-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-win-x64-2.0.0.jar
  - wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-native-lib-win-arm64-2.0.0.jar

install:
  - mvn install:install-file -Dfile=sherpa-onnx-2.0.0.aar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx -Dversion=2.0.0 -Dpackaging=aar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-jvm-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-jvm -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-linux-aarch64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-linux-aarch64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-linux-x64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-linux-x64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-osx-aarch64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-osx-aarch64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-osx-x64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-osx-x64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-win-x64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-win-x64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
  - mvn install:install-file -Dfile=sherpa-onnx-native-lib-win-arm64-2.0.0.jar -DgroupId=com.github.k2-fsa -DartifactId=sherpa-onnx-native-lib-win-arm64 -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
