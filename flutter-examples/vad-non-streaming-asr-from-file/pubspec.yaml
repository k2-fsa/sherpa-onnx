name: vad_non_streaming_asr_from_file
description: >
  VAD + Non-streaming ASR from file demo using sherpa-onnx.

publish_to: 'none'

version: 1.13.6

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=2.8.1"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sherpa_onnx: ^1.13.6
  # sherpa_onnx:
  #   path: ../../flutter/sherpa_onnx
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  ffmpeg_kit_flutter_new: ^4.6.0
  url_launcher: 6.2.6
  url_launcher_linux: 3.1.0

flutter:
  uses-material-design: true
