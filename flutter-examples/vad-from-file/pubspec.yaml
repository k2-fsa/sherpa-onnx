name: vad_from_file
description: >
  Voice Activity Detection from file demo using sherpa-onnx.

publish_to: 'none'

version: 1.13.5

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=2.8.1"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sherpa_onnx: ^1.13.5
  # sherpa_onnx:
  #   path: ../../flutter/sherpa_onnx
  video_player: ^2.8.0
  ffmpeg_kit_flutter_new: ^4.6.0
  url_launcher: 6.2.6
  url_launcher_linux: 3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/
