name: sherpa_onnx

description: >
  Speech recognition, speech synthesis, and speaker recognition using next-gen Kaldi
  with onnxruntime without Internet connection.

repository: https://github.com/k2-fsa/sherpa-onnx/tree/master/flutter

issue_tracker: https://github.com/k2-fsa/sherpa-onnx/issues
documentation: https://k2-fsa.github.io/sherpa/onnx/

topics:
  - speech-recognition
  - speech-synthesis
  - speaker-identification
  - audio-tagging
  - voice-activity-detection

# remember to change the version in ../sherpa_onnx_macos/macos/sherpa_onnx_macos.podspec
version: 1.13.7

homepage: https://github.com/k2-fsa/sherpa-onnx

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  ffi: ^2.1.0
  sherpa_onnx_android_arm64: 1.13.7
  # sherpa_onnx_android_arm64:
  #   path: ../sherpa_onnx_android_arm64

  sherpa_onnx_android_armeabi: 1.13.7
  # sherpa_onnx_android_armeabi:
  #   path: ../sherpa_onnx_android_armeabi

  sherpa_onnx_android_x86: 1.13.7
  # sherpa_onnx_android_x86:
  #   path: ../sherpa_onnx_android_x86

  sherpa_onnx_android_x86_64: 1.13.7
  # sherpa_onnx_android_x86_64:
  #   path: ../sherpa_onnx_android_x86_64

  sherpa_onnx_ios: 1.13.7
  # sherpa_onnx_ios:
  #   path: ../sherpa_onnx_ios

  sherpa_onnx_linux: 1.13.7
  # sherpa_onnx_linux:
  #   path: ../sherpa_onnx_linux

  sherpa_onnx_macos: 1.13.7
  # sherpa_onnx_macos:
  #   path: ../sherpa_onnx_macos

  sherpa_onnx_web: 1.13.7
  # sherpa_onnx_web:
  #   path: ../sherpa_onnx_web

  sherpa_onnx_windows: 1.13.7
  # sherpa_onnx_windows:
  #   path: ../sherpa_onnx_windows

flutter:
  plugin:
    platforms:
      android:
        default_package: sherpa_onnx_android_arm64
      ios:
        default_package: sherpa_onnx_ios
      linux:
        default_package: sherpa_onnx_linux
      macos:
        default_package: sherpa_onnx_macos
      web:
        default_package: sherpa_onnx_web
      windows:
        default_package: sherpa_onnx_windows
