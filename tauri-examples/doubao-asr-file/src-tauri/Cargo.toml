[package]
name = "doubao-asr-file"
version = "2.0.0"
description = "Doubao ASR from audio/video files with sherpa-onnx VAD"
edition = "2021"

[lib]
name = "doubao_asr_file_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Reads Android content:// URIs and iOS file:// URLs returned by the picker.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = "2"
# Default features = ["static"]: sherpa-onnx-sys downloads the prebuilt static
# native libraries for the target — CI does not build sherpa-onnx from source.
sherpa-onnx = "2.0.0"

# symphonia: pure Rust audio decoder — no system deps, Tauri-packable.
# Covers wav/mp3/flac/ogg/m4a/aac/aiff + the audio tracks of mp4/mov/mkv/webm/
# m4v/ogv/3gp. Codecs it lacks (opus, wma) and containers it cannot demux
# (avi) fall back to ffmpeg when it is on PATH; see src/audio.rs.
symphonia = { version = "0.5.5", features = [
    "mp1",
    "mp2",
    "mp3",
    "aac",
    "alac",
    "flac",
    "vorbis",
    "wav",
    "ogg",
    "isomp4",
    "mkv",
    "pcm",
    "adpcm",
    "aiff",
    "caf",
] }
tauri-plugin-share = "2"
tauri-plugin-opener = "2"

[profile.dev]
debug = false
strip = "symbols"
