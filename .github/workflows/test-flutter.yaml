name: test-flutter

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: test-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos_cocoapods:
    name: macOS (CocoaPods)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-flutter-cocoapods

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.44.8

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Cache xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework
          key: macos-xcframework-${{ hashFiles('build-macos-shared-sherpa-with-static-onnxruntime.sh', 'CMakeLists.txt') }}
          restore-keys: |
            macos-xcframework-

      - name: Build xcframework from source
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework
        shell: bash
        run: |
          cp -av build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework
          ls -lh flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework/

      - name: Use local sherpa_onnx_macos
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_macos: 1.13.7|  # sherpa_onnx_macos: 1.13.7\n  sherpa_onnx_macos:\n    path: ../sherpa_onnx_macos|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app (CocoaPods)
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd macos && pod install && cd ..
          flutter build macos

          ls -lh build/macos/Build/Products/Release/

      - name: Ad-hoc sign the app
        shell: bash
        run: |
          codesign --force --deep -s - flutter-examples/hello_world/build/macos/Build/Products/Release/hello_world.app
          xattr -cr flutter-examples/hello_world/build/macos/Build/Products/Release/hello_world.app

      - name: Zip app
        shell: bash
        run: |
          cd flutter-examples/hello_world/build/macos/Build/Products/Release/
          mkdir -p flutter-hello-world-macos-cocoapods
          mv hello_world.app flutter-hello-world-macos-cocoapods/
          zip -r -y flutter-hello-world-macos-cocoapods.zip flutter-hello-world-macos-cocoapods/
          ls -lh flutter-hello-world-macos-cocoapods.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-macos-cocoapods
          path: flutter-examples/hello_world/build/macos/Build/Products/Release/flutter-hello-world-macos-cocoapods.zip

  macos_spm:
    name: macOS (SPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-flutter-spm

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Cache xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework
          key: macos-xcframework-${{ hashFiles('build-macos-shared-sherpa-with-static-onnxruntime.sh', 'CMakeLists.txt') }}
          restore-keys: |
            macos-xcframework-

      - name: Build xcframework from source
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework
        shell: bash
        run: |
          cp -av build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework
          ls -lh flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework/

      - name: Use local sherpa_onnx_macos
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_macos: 1.13.7|  # sherpa_onnx_macos: 1.13.7\n  sherpa_onnx_macos:\n    path: ../sherpa_onnx_macos|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app (SPM)
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter config --enable-swift-package-manager
          flutter pub get
          # Remove CocoaPods build phases from Xcode project
          cd macos && pod deintegrate && cd ..
          rm -f macos/Podfile macos/Podfile.lock
          flutter build macos

          ls -lh build/macos/Build/Products/Release/

      - name: Ad-hoc sign the app
        shell: bash
        run: |
          codesign --force --deep -s - flutter-examples/hello_world/build/macos/Build/Products/Release/hello_world.app
          xattr -cr flutter-examples/hello_world/build/macos/Build/Products/Release/hello_world.app

      - name: Zip app
        shell: bash
        run: |
          cd flutter-examples/hello_world/build/macos/Build/Products/Release/
          mkdir -p flutter-hello-world-macos-spm
          mv hello_world.app flutter-hello-world-macos-spm/
          zip -r -y flutter-hello-world-macos-spm.zip flutter-hello-world-macos-spm/
          ls -lh flutter-hello-world-macos-spm.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-macos-spm
          path: flutter-examples/hello_world/build/macos/Build/Products/Release/flutter-hello-world-macos-spm.zip

  ios_cocoapods:
    name: iOS (CocoaPods)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-flutter-cocoapods

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.44.8

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build iOS xcframework from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework
        shell: bash
        run: |
          cp -av build-ios-shared-sherpa-with-static-onnxruntime/SherpaOnnxC.xcframework flutter/sherpa_onnx_ios/ios/sherpa_onnx_ios/SherpaOnnxC.xcframework
          ls -lh flutter/sherpa_onnx_ios/ios/sherpa_onnx_ios/SherpaOnnxC.xcframework/

      - name: Use local sherpa_onnx_ios
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_ios: 1.13.7|  # sherpa_onnx_ios: 1.13.7\n  sherpa_onnx_ios:\n    path: ../sherpa_onnx_ios|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app (CocoaPods)
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --no-codesign

          ls -lh build/ios/iphoneos/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-ios-cocoapods
          path: flutter-examples/hello_world/build/ios/iphoneos/Runner.app

  ios_spm:
    name: iOS (SPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-flutter-spm

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build iOS xcframework from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework
        shell: bash
        run: |
          cp -av build-ios-shared-sherpa-with-static-onnxruntime/SherpaOnnxC.xcframework flutter/sherpa_onnx_ios/ios/sherpa_onnx_ios/SherpaOnnxC.xcframework
          ls -lh flutter/sherpa_onnx_ios/ios/sherpa_onnx_ios/SherpaOnnxC.xcframework/

      - name: Use local sherpa_onnx_ios
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_ios: 1.13.7|  # sherpa_onnx_ios: 1.13.7\n  sherpa_onnx_ios:\n    path: ../sherpa_onnx_ios|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app (SPM)
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter config --enable-swift-package-manager
          flutter pub get
          # Remove CocoaPods build phases from Xcode project
          cd ios && pod deintegrate && cd ..
          rm -f ios/Podfile ios/Podfile.lock
          flutter build ios --no-codesign

          ls -lh build/ios/iphoneos/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-ios-spm
          path: flutter-examples/hello_world/build/ios/iphoneos/Runner.app

  linux:
    name: Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, ubuntu-24.04-arm]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-flutter

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build sherpa-onnx from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir build
          cd build
          cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..
          cmake --build . --target install --config Release

      - name: Copy libs
        shell: bash
        run: |
          if [[ $(uname -m) == "aarch64" ]]; then
            arch=aarch64
          else
            arch=x64
          fi
          cp -fv build/install/lib/lib* ./flutter/sherpa_onnx_linux/linux/$arch
          ls -lh ./flutter/sherpa_onnx_linux/linux/$arch

      - name: Use local sherpa_onnx_linux
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_linux: 1.13.7|  # sherpa_onnx_linux: 1.13.7\n  sherpa_onnx_linux:\n    path: ../sherpa_onnx_linux|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build linux

          ls -lh build/linux/*/release/bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-linux-x64
          path: flutter-examples/hello_world/build/linux/*/release/bundle/

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build sherpa-onnx from source
        shell: bash
        run: |
          mkdir build
          cd build
          cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..
          cmake --build . --target install --config Release

      - name: Copy libs
        shell: bash
        run: |
          cp -fv build/install/lib/*.dll ./flutter/sherpa_onnx_windows/windows/
          ls -lh ./flutter/sherpa_onnx_windows/windows/

      - name: Use local sherpa_onnx_windows
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_windows: 1.13.7|  # sherpa_onnx_windows: 1.13.7\n  sherpa_onnx_windows:\n    path: ../sherpa_onnx_windows|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter app
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build windows

          ls -lh build/windows/x64/runner/Release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-win-x64
          path: flutter-examples/hello_world/build/windows/x64/runner/Release/

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target_platform: android-arm64
            build_script: build-android-arm64-v8a.sh
            build_dir: build-android-arm64-v8a
            plugin: sherpa_onnx_android_arm64
            plugin_key: sherpa_onnx_android_arm64
          - abi: armeabi-v7a
            target_platform: android-arm
            build_script: build-android-armv7-eabi.sh
            build_dir: build-android-armv7-eabi
            plugin: sherpa_onnx_android_armeabi
            plugin_key: sherpa_onnx_android_armeabi
          - abi: x86_64
            target_platform: android-x64
            build_script: build-android-x86-64.sh
            build_dir: build-android-x86-64
            plugin: sherpa_onnx_android_x86_64
            plugin_key: sherpa_onnx_android_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-flutter-${{ matrix.abi }}

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build ${{ matrix.abi }} from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export SHERPA_ONNX_ENABLE_C_API=ON
          export SHERPA_ONNX_ENABLE_JNI=OFF
          export SHERPA_ONNX_ENABLE_BINARY=OFF
          ./${{ matrix.build_script }}

      - name: Copy libs
        shell: bash
        run: |
          cp -fv ${{ matrix.build_dir }}/install/lib/lib*.so flutter/${{ matrix.plugin }}/android/src/main/jniLibs/${{ matrix.abi }}/
          ls -lh flutter/${{ matrix.plugin }}/android/src/main/jniLibs/${{ matrix.abi }}/

      - name: Use local ${{ matrix.plugin }}
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  ${{ matrix.plugin_key }}: 1.13.7|  # ${{ matrix.plugin_key }}: 1.13.7\n  ${{ matrix.plugin_key }}:\n    path: ../${{ matrix.plugin }}|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter APK
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build apk --split-per-abi --target-platform ${{ matrix.target_platform }}

          ls -lh build/app/outputs/flutter-apk/

      - name: Rename APK
        shell: bash
        run: |
          cd flutter-examples/hello_world/build/app/outputs/flutter-apk/
          mv app-*-release.apk flutter-hello-world-${{ matrix.abi }}.apk
          ls -lh *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-android-${{ matrix.abi }}
          path: flutter-examples/hello_world/build/app/outputs/flutter-apk/flutter-hello-world-${{ matrix.abi }}.apk

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build WASM module
        shell: bash
        run: |
          ./build-wasm-simd-web.sh

      - name: Copy WASM assets to web plugin
        shell: bash
        run: |
          ./build-flutter-web-wasm.sh

      - name: Use local sherpa_onnx_web
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_web: 1.13.7|  # sherpa_onnx_web: 1.13.7\n  sherpa_onnx_web:\n    path: ../sherpa_onnx_web|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Build Flutter web app
        shell: bash
        run: |
          cd flutter-examples/hello_world

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build web

          ls -lh build/web/

      - name: Zip web app
        shell: bash
        run: |
          cd flutter-examples/hello_world/build/
          mv web flutter-hello-world-web
          zip -r -y flutter-hello-world-web.zip flutter-hello-world-web/
          ls -lh flutter-hello-world-web.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-hello-world-web
          path: flutter-examples/hello_world/build/flutter-hello-world-web.zip
