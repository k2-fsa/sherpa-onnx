name: export-nemotron-3-diarization

on:
  workflow_dispatch:

concurrency:
  group: export-nemotron-3-diarization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-nemotron-3-diarization:
    if: github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj'
    name: export Nemotron-3-Diarization to ONNX
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/nemo/nemotron-3-diarization/requirements.txt

      - name: Run
        shell: bash
        run: |
          d=sherpa-onnx-nemotron-3-diarization
          src=$PWD/$d
          mkdir -p $src

          pushd scripts/nemo/nemotron-3-diarization
          ./run.sh
          cp ./*.onnx $src/
          cp ./README.md $src/
          cp ./*.py $src/
          cp ./requirements.txt $src/
          cp ./run.sh $src/
          mkdir -p $src/test_wavs
          cp ./0-four-speakers-zh.wav $src/test_wavs/

          popd

          curl -fSL https://raw.githubusercontent.com/OpenMDW/OpenMDW/main/1.1/LICENSE.OpenMDW-1.1 -o $src/LICENSE
          curl -fSL https://huggingface.co/nvidia/Nemotron-3-Diarization/resolve/main/README.md -o $src/MODEL_CARD.md

          cat >$src/NOTICE <<EOT
          The model is from https://huggingface.co/nvidia/Nemotron-3-Diarization
          and is released under the OpenMDW License Agreement v1.1.
          The original model is by NVIDIA; these files are ONNX conversions
          with FP32 and dynamic INT8 weights. See LICENSE and MODEL_CARD.md.
          EOT

          ls -lh $d
          tar cjfv $d.tar.bz2 $d

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: ./*.tar.bz2
          overwrite: true
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: speaker-segmentation-models

      - name: Publish to huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            d=sherpa-onnx-nemotron-3-diarization
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false
            rm -rf huggingface
            git clone https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/$d huggingface
            cp -v $d/* ./huggingface
            cd huggingface
            git lfs track "*.onnx"
            git status
            git add .
            git status
            git commit -m "add models"
            git push https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/$d main
