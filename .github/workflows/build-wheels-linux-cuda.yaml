name: build-wheels-linux-cuda

on:
  push:
    branches:
      - wheel
  workflow_dispatch:

env:
  SHERPA_ONNX_IS_IN_GITHUB_ACTIONS: 1

concurrency:
  group: build-wheels-linux-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generating build matrix
        id: set-matrix
        run: |
          MATRIX=$(python3 .github/scripts/wheels/linux_x64_cuda.py)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build_wheels_linux_cuda:
    needs: [generate_matrix]
    name: ${{ matrix.python-version }} ${{ matrix.onnxruntime_version }} cuda${{ matrix.cuda_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ${{ fromJson(needs.generate_matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        shell: bash
        run: |
          if [[ ${{ matrix.python-version }} == "3.7" ]]; then
            pip install -U pip wheel setuptools twine
          else
            pip install -U pip wheel setuptools twine==5.0.0
          fi

      - name: Build alsa-lib
        shell: bash
        run: |
          git clone --depth 1 --branch v1.2.12 https://github.com/alsa-project/alsa-lib
          cd alsa-lib
          ./gitcompile

      - name: Build sherpa-onnx
        shell: bash
        run: |
          export CPLUS_INCLUDE_PATH=$PWD/alsa-lib/include:$CPLUS_INCLUDE_PATH
          export C_INCLUDE_PATH=$PWD/alsa-lib/include:$C_INCLUDE_PATH
          export SHERPA_ONNX_ALSA_LIB_DIR=$PWD/alsa-lib/src/.libs
          export LD_LIBRARY_PATH=$SHERPA_ONNX_ALSA_LIB_DIR:$LD_LIBRARY_PATH

          echo "CPLUS_INCLUDE_PATH: $CPLUS_INCLUDE_PATH"
          ls -lh $PWD/alsa-lib/include
          echo "---"
          ls -lh $PWD/alsa-lib/src/.libs

          p=$PWD

          export SHERPA_ONNX_MAKE_ARGS="VERBOSE=1"
          export SHERPA_ONNX_ENABLE_ALSA=1
          export SHERPA_ONNX_CMAKE_ARGS="-DSHERPA_ONNX_ENABLE_GPU=ON"

          curl -SL -O https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${{ matrix.onnxruntime_version }}/onnxruntime-linux-x64-${{ matrix.onnxruntime_url_suffix }}.zip
          unzip onnxruntime-linux-x64-${{ matrix.onnxruntime_url_suffix }}.zip

          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/${{ matrix.onnxruntime_dir_name }}/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/${{ matrix.onnxruntime_dir_name }}/include

          export SHERPA_ONNX_CUDA_VERSION="${{ matrix.cuda_version_tag }}"

          python3 setup.py bdist_wheel

          ls -lh dist

          mv dist wheelhouse

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - name: Install patchelf
        shell: bash
        run: |
          pip install patchelf
          patchelf --version

      - name: Patch wheels
        shell: bash
        run: |
          mkdir ./wheels
          sudo ./scripts/wheel/patch_wheel.py --in-dir ./wheelhouse --out-dir ./wheels

          ls -lh ./wheels/
          rm -rf ./wheelhouse
          mv ./wheels ./wheelhouse


      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cuda-${{ matrix.python-version }}-${{ matrix.onnxruntime_version }}-cuda${{ matrix.cuda_version }}
          path: ./wheelhouse/*.whl

      - name: Publish to huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false

            SHERPA_ONNX_VERSION=$(grep "SHERPA_ONNX_VERSION" ./CMakeLists.txt  | cut -d " " -f 2  | cut -d '"' -f 2)
            echo "SHERPA_ONNX_VERSION $SHERPA_ONNX_VERSION"

            d=cuda/$SHERPA_ONNX_VERSION

            git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/sherpa-onnx-wheels huggingface
            cd huggingface
            git fetch
            git pull
            git merge -m "merge remote" --ff origin main

            mkdir -p $d

            cp -v ../wheelhouse/*.whl $d/

            git status
            git add .
            git commit -m "add more wheels"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/sherpa-onnx-wheels main
