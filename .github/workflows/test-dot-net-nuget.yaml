name: test-dot-net-nuget

on:
  workflow_dispatch:

concurrency:
  group: test-dot-net-nuget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-dot-net-nuget:
    if: github.repository_owner == 'csukuangfj' || github.repository_owner == 'k2-fsa'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Free space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          df -h
          rm -rf /opt/hostedtoolcache
          df -h

      - name: Free more space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # https://github.com/orgs/community/discussions/25678
          cd /opt
          find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf '{}' ';'

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Check space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          df -h

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check dotnet
        run: dotnet --info

      - name: Run tests
        shell: bash
        run: |
          .github/scripts/test-dot-net.sh

      - name: Show fa result english-mfa-v3.1.0
        shell: bash
        run: cat dotnet-examples/forced-alignment-english/en.TextGrid

      - name: Show fa result zh-aishell3-pinyin
        shell: bash
        run: cat dotnet-examples/forced-alignment-chinese/zh.TextGrid

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract word wavs from the TextGrids
        shell: bash
        run: |
          python3 -m pip install soundfile
          python3 ./python-api-examples/textgrid-to-word-wavs.py \
            --wav dotnet-examples/forced-alignment-english/en.wav \
            --textgrid dotnet-examples/forced-alignment-english/en.TextGrid \
            --out-dir word-clips-en
          python3 ./python-api-examples/textgrid-to-word-wavs.py \
            --wav dotnet-examples/forced-alignment-chinese/zh.wav \
            --textgrid dotnet-examples/forced-alignment-chinese/zh.TextGrid \
            --out-dir word-clips-zh

      - uses: actions/upload-artifact@v4
        with:
          name: fa-textgrids-english-mfa-v3.1.0-${{ matrix.os }}
          path: dotnet-examples/forced-alignment-english/en.TextGrid
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: fa-textgrids-zh-aishell3-pinyin-${{ matrix.os }}
          path: dotnet-examples/forced-alignment-chinese/zh.TextGrid
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: fa-word-clips-english-mfa-v3.1.0-${{ matrix.os }}
          path: ./word-clips-en
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: fa-word-clips-zh-aishell3-pinyin-${{ matrix.os }}
          path: ./word-clips-zh
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: dot-net-tts-generated-test-files-${{ matrix.os }}
          path: tts

      - uses: actions/upload-artifact@v4
        with:
          name: speech-enhancement-voxlock-${{ matrix.os }}
          # each example dir keeps its input and output wavs
          path: dotnet-examples/speech-enhancement-voxlock/*.wav
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: speech-enhancement-voxlock-with-voice-sample-${{ matrix.os }}
          path: dotnet-examples/speech-enhancement-voxlock-with-voice-sample/*.wav
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: streaming-speech-enhancement-voxlock-${{ matrix.os }}
          path: dotnet-examples/streaming-speech-enhancement-voxlock/*.wav
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: streaming-speech-enhancement-voxlock-with-voice-sample-${{ matrix.os }}
          path: dotnet-examples/streaming-speech-enhancement-voxlock-with-voice-sample/*.wav
          if-no-files-found: warn
