name: jni

on:
  push:
    branches:
      - master
      - jni
      - kotlin
    paths:
      - '.github/workflows/jni.yaml'
      - 'cmake/**'
      - 'kotlin-api-examples/**'
      - 'sherpa-onnx/kotlin-api/**'
      - 'sherpa-onnx/csrc/*'
      - 'sherpa-onnx/jni/*'

  workflow_dispatch:

concurrency:
  group: jni-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jni:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}

      - name: OS info
        shell: bash
        run: |
          uname -a

      - name: Display kotlin version
        shell: bash
        run: |
          kotlinc -version

      - name: Display java version
        shell: bash
        run: |
          java -version
          javac -help
          echo "JAVA_HOME is: ${JAVA_HOME}"

      - name:  Run JNI test
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake --version

          cd ./kotlin-api-examples
          ./run.sh

      - name: Show fa result english-mfa-v3.1.0
        shell: bash
        run: cat kotlin-api-examples/test_forced_alignment_english/en.TextGrid

      - name: Show fa result zh-aishell3-pinyin
        shell: bash
        run: cat kotlin-api-examples/test_forced_alignment_chinese/zh.TextGrid

      - name: Extract word wavs from the TextGrids
        shell: bash
        run: |
          python3 ./python-api-examples/textgrid-to-word-wavs.py \
            --wav kotlin-api-examples/test_forced_alignment_english/en.wav \
            --textgrid kotlin-api-examples/test_forced_alignment_english/en.TextGrid \
            --out-dir word-clips-en
          python3 ./python-api-examples/textgrid-to-word-wavs.py \
            --wav kotlin-api-examples/test_forced_alignment_chinese/zh.wav \
            --textgrid kotlin-api-examples/test_forced_alignment_chinese/zh.TextGrid \
            --out-dir word-clips-zh

      - uses: actions/upload-artifact@v4
        with:
          name: fa-textgrids-english-mfa-v3.1.0-${{ matrix.os }}
          path: kotlin-api-examples/test_forced_alignment_english/en.TextGrid

      - uses: actions/upload-artifact@v4
        with:
          name: fa-textgrids-zh-aishell3-pinyin-${{ matrix.os }}
          path: kotlin-api-examples/test_forced_alignment_chinese/zh.TextGrid

      - uses: actions/upload-artifact@v4
        with:
          name: fa-word-clips-english-mfa-v3.1.0-${{ matrix.os }}
          path: ./word-clips-en

      - uses: actions/upload-artifact@v4
        with:
          name: fa-word-clips-zh-aishell3-pinyin-${{ matrix.os }}
          path: ./word-clips-zh

      - name: Clean up fa files
        shell: bash
        run: |
          rm -rf kotlin-api-examples/english-mfa-v3.1.0 kotlin-api-examples/zh-aishell3-pinyin
          rm -rf kotlin-api-examples/test_forced_alignment_english
          rm -rf kotlin-api-examples/test_forced_alignment_chinese
          rm -rf word-clips-en word-clips-zh

      - uses: actions/upload-artifact@v4
        with:
          name: tts-files-${{ matrix.os }}
          path: kotlin-api-examples/test-*.wav

      - uses: actions/upload-artifact@v4
        with:
          name: test-offline-speech-denoiser-voxlock-${{ matrix.os }}
          # run.sh keeps the input and output wavs of each test in a folder
          # named after the test file
          path: kotlin-api-examples/test_offline_speech_denoiser_voxlock
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: test-offline-speech-denoiser-voxlock-with-voice-sample-${{ matrix.os }}
          path: kotlin-api-examples/test_offline_speech_denoiser_voxlock_with_voice_sample
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: test-online-speech-denoiser-voxlock-${{ matrix.os }}
          path: kotlin-api-examples/test_online_speech_denoiser_voxlock
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: test-online-speech-denoiser-voxlock-with-voice-sample-${{ matrix.os }}
          path: kotlin-api-examples/test_online_speech_denoiser_voxlock_with_voice_sample
          if-no-files-found: warn
