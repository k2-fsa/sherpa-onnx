name: test-tauri-doubao-asr-file

on:
  push:
    branches:
      - master
      - tauri-doubao-asr-gui
  workflow_dispatch:

concurrency:
  group: test-tauri-doubao-asr-file-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; each publishing job opts into contents: write.
permissions:
  contents: read

# sherpa-onnx is used as a plain Rust crate: sherpa-onnx-sys downloads the
# prebuilt native libraries for the target (and wires the iOS xcframework /
# Android jniLibs into the Tauri project by itself), so CI does not build
# sherpa-onnx from source. Linking is static (the crate's default feature).

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # uploads release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Download silero_vad.onnx
        shell: bash
        run: |
          mkdir -p tauri-examples/doubao-asr-file/src-tauri/assets
          curl -sSL -o tauri-examples/doubao-asr-file/src-tauri/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh tauri-examples/doubao-asr-file/src-tauri/assets/

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm install

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/

      - name: Ad-hoc sign the app
        shell: bash
        run: |
          app_path=$(find tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            .github/scripts/flutter/sign_macos_app.sh "$app_path"
          fi

      - name: Zip app
        shell: bash
        run: |
          zip_name="tauri-doubao-asr-file-macos-${{ matrix.arch }}.zip"
          app_path=$(find tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            app_name=$(basename "$app_path" .app)
            cd tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos/
            rm -rf tauri-doubao-asr-file-macos-${{ matrix.arch }}
            mkdir -p tauri-doubao-asr-file-macos-${{ matrix.arch }}
            mv "${app_name}.app" tauri-doubao-asr-file-macos-${{ matrix.arch }}/
            zip -r -y "$zip_name" tauri-doubao-asr-file-macos-${{ matrix.arch }}/
            ls -lh "$zip_name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-doubao-asr-file-macos-${{ matrix.arch }}
          path: tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos/tauri-doubao-asr-file-macos-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos/tauri-doubao-asr-file-macos-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/doubao-asr-file/src-tauri/target/release/bundle/macos/tauri-doubao-asr-file-macos-${{ matrix.arch }}.zip
          tag: tauri

  ios:
    name: iOS
    runs-on: macos-latest
    permissions:
      contents: write  # uploads release assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Download silero_vad.onnx
        shell: bash
        run: |
          mkdir -p tauri-examples/doubao-asr-file/src-tauri/assets
          curl -sSL -o tauri-examples/doubao-asr-file/src-tauri/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh tauri-examples/doubao-asr-file/src-tauri/assets/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm install

      # sherpa-onnx-sys downloads the prebuilt xcframework during a cargo
      # build for the iOS target and copies it into src-tauri/ (referenced by
      # bundle.iOS.frameworks in tauri.conf.json, same as the hello_world
      # example). Xcode needs it on disk before it starts, so check-build
      # once first.
      - name: Fetch sherpa-onnx xcframework
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file/src-tauri
          cargo check --target aarch64-apple-ios
          ls -lh
          test -d sherpa-onnx.xcframework

      - name: Init iOS
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npx tauri ios init

      - name: Build iOS for device
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npx tauri ios build --target aarch64 --no-sign

      - name: Build iOS for simulator
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npx tauri ios build --target aarch64-sim --no-sign

      - name: Package iOS artifacts
        shell: bash
        run: |
          set -e
          ipa=$(find tauri-examples/doubao-asr-file/src-tauri -name "*.ipa" | head -1)
          if [ -z "$ipa" ]; then
            echo "device IPA not found — refusing to publish incomplete artifacts" >&2
            exit 1
          fi
          cp "$ipa" tauri-doubao-asr-file-ios-device.ipa
          ls -lh tauri-doubao-asr-file-ios-device.ipa

          sim_app=$(find tauri-examples/doubao-asr-file/src-tauri -name "doubao-asr-file.app" | head -1)
          if [ -z "$sim_app" ]; then
            echo "simulator app not found — refusing to publish incomplete artifacts" >&2
            exit 1
          fi
          cd "$(dirname "$sim_app")"
          zip -r -y tauri-doubao-asr-file-ios-simulator.zip "$(basename "$sim_app")"
          mv tauri-doubao-asr-file-ios-simulator.zip $GITHUB_WORKSPACE/
          ls -lh $GITHUB_WORKSPACE/tauri-doubao-asr-file-ios-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-doubao-asr-file-ios
          path: tauri-doubao-asr-file-ios-*
          if-no-files-found: ignore

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-ios-*
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-ios-*
          tag: tauri

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # uploads release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Download silero_vad.onnx
        shell: bash
        run: |
          mkdir -p tauri-examples/doubao-asr-file/src-tauri/assets
          curl -sSL -o tauri-examples/doubao-asr-file/src-tauri/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh tauri-examples/doubao-asr-file/src-tauri/assets/

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm install

      - name: Run Rust unit tests
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file/src-tauri
          cargo test

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm run build

      - name: Zip app
        shell: bash
        run: |
          zip_name="tauri-doubao-asr-file-linux-${{ matrix.arch }}.zip"
          dir_name="tauri-doubao-asr-file-linux-${{ matrix.arch }}"
          cd tauri-examples/doubao-asr-file/src-tauri/target/release/
          rm -rf "$dir_name"
          mkdir -p "$dir_name"
          # Static linking: the executable is self-contained.
          cp doubao-asr-file "$dir_name/"
          zip -r -y "$zip_name" "$dir_name/"
          mv "$zip_name" $GITHUB_WORKSPACE/
          ls -lh "$GITHUB_WORKSPACE/$zip_name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-doubao-asr-file-linux-${{ matrix.arch }}
          path: tauri-doubao-asr-file-linux-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-linux-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-linux-${{ matrix.arch }}.zip
          tag: tauri

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # uploads release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Download silero_vad.onnx
        shell: bash
        run: |
          mkdir -p tauri-examples/doubao-asr-file/src-tauri/assets
          curl -sSL -o tauri-examples/doubao-asr-file/src-tauri/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh tauri-examples/doubao-asr-file/src-tauri/assets/

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm install

      # pwsh, not bash: under Git Bash, /usr/bin comes first in PATH and its
      # GNU coreutils `link.exe` shadows MSVC's linker, breaking every cargo
      # link with "linking with `link.exe` failed ... /usr/bin/link: extra
      # operand".
      - name: Build
        shell: pwsh
        run: |
          cd tauri-examples/doubao-asr-file
          npm run build

      - name: Zip app
        shell: bash
        run: |
          zip_name="tauri-doubao-asr-file-win-${{ matrix.arch }}.zip"
          dir_name="tauri-doubao-asr-file-win-${{ matrix.arch }}"
          cd tauri-examples/doubao-asr-file/src-tauri/target/release/
          rm -rf "$dir_name"
          mkdir -p "$dir_name"
          # Static linking: the executable is self-contained.
          cp doubao-asr-file.exe "$dir_name/"
          powershell -Command "Compress-Archive -Path $dir_name -DestinationPath $GITHUB_WORKSPACE/$zip_name"
          ls -lh "$GITHUB_WORKSPACE/$zip_name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-doubao-asr-file-win-${{ matrix.arch }}
          path: tauri-doubao-asr-file-win-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-win-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-win-${{ matrix.arch }}.zip
          tag: tauri

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    permissions:
      contents: write  # uploads release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            tauri_target: armv7
          - abi: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Download silero_vad.onnx
        shell: bash
        run: |
          mkdir -p tauri-examples/doubao-asr-file/src-tauri/assets
          curl -sSL -o tauri-examples/doubao-asr-file/src-tauri/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh tauri-examples/doubao-asr-file/src-tauri/assets/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npm install

      - name: Init Android
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npx tauri android init

      # The Kotlin helper plugin must be in the generated project BEFORE Gradle
      # runs, or it is never compiled into the APK and the app dies at startup
      # looking up the class.
      - name: Install helper plugin into the Android project
        shell: bash
        run: |
          d=tauri-examples/doubao-asr-file/src-tauri/gen/android/app/src/main/java/com/plugin/apphelper
          mkdir -p "$d"
          cp tauri-examples/doubao-asr-file/src-tauri/android/AppHelperPlugin.kt "$d/"
          ls -lh "$d"

      - name: Build Android
        shell: bash
        run: |
          cd tauri-examples/doubao-asr-file
          npx tauri android build --target ${{ matrix.tauri_target }} --apk --debug

      # Sign with the shared CI keystore (v1+v2): Gradle's debug key is
      # regenerated on every job, which makes each build a different signer
      # and breaks upgrades on many OEM installers ("packageInfo is null").
      - name: Re-sign APK and rename
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          apk=$(find tauri-examples/doubao-asr-file/src-tauri -name "*.apk" | head -1)
          if [ -z "$apk" ]; then
            echo "no APK found"; exit 1
          fi
          .github/scripts/sign_apk.sh "$apk" "tauri-doubao-asr-file-${{ matrix.abi }}.apk"

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-${{ matrix.abi }}.apk
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-doubao-asr-file-${{ matrix.abi }}.apk
          tag: tauri
