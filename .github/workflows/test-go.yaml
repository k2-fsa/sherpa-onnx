name: test-go

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: test-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libs:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: windows-2022
            arch: x64
          - os: windows-2022
            arch: x86

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}-go

      - name: Set up MinGW for x64
        if: matrix.os == 'windows-2022' && matrix.arch == 'x64'
        uses: csukuangfj/setup-mingw@v2.2.1
        with:
          platform: ${{ matrix.arch }}

      - name: Set up MinGW for x86
        if: matrix.os == 'windows-2022' && matrix.arch == 'x86'
        uses: csukuangfj/setup-mingw@v2.2.1
        with:
          platform: x86
          version: '12.2.0'

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.17'

      - name: Set GOARCH for x86
        if: matrix.os == 'windows-2022' && matrix.arch == 'x86'
        shell: bash
        run: |
          go env -w GOARCH=386
          go env -w CGO_ENABLED=1

      - name: Cache built libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            scripts/go/_internal/lib
            to-upload
          key: go-libs-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}-v9

      - name: Build sherpa-onnx
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          upload_dir=$PWD/to-upload
          mkdir -p $upload_dir

          if [[ "${{ matrix.os }}" != "windows-2022" ]]; then
            export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          fi
          mkdir build
          cd build

          cmake_extra_args=""
          if [[ "${{ matrix.os }}" == "windows-2022" && "${{ matrix.arch }}" == "x86" ]]; then
            cmake_extra_args="-A Win32"
          fi

          cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            $cmake_extra_args \
            ..

          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            cmake --build . --target install --config Release -- -m:2
          else
            make -j2 install
          fi

          # Determine the Go lib directory for this platform
          if [[ "${{ matrix.os }}" == macos-latest ]]; then
            go_lib_dir=../scripts/go/_internal/lib/aarch64-apple-darwin
          elif [[ "${{ matrix.os }}" == macos-15-intel ]]; then
            go_lib_dir=../scripts/go/_internal/lib/x86_64-apple-darwin
          elif [[ "${{ matrix.os }}" == ubuntu-latest ]]; then
            go_lib_dir=../scripts/go/_internal/lib/x86_64-unknown-linux-gnu
          elif [[ "${{ matrix.os }}" == ubuntu-22.04-arm ]]; then
            go_lib_dir=../scripts/go/_internal/lib/aarch64-unknown-linux-gnu
          elif [[ "${{ matrix.os }}" == windows-2022 && "${{ matrix.arch }}" == "x86" ]]; then
            go_lib_dir=../scripts/go/_internal/lib/i686-pc-windows-gnu
          elif [[ "${{ matrix.os }}" == windows-2022 ]]; then
            go_lib_dir=../scripts/go/_internal/lib/x86_64-pc-windows-gnu
          fi
          mkdir -p "$go_lib_dir"

          if [[ ${{ matrix.os }} == windows-2022 ]]; then
            cp -v ./install/lib/sherpa-onnx-c-api.dll "$go_lib_dir/"
            cp -v ./install/lib/onnxruntime.dll "$go_lib_dir/"
            cp -v ./install/lib/sherpa-onnx-c-api.lib "$go_lib_dir/"
            cp -v ./install/lib/onnxruntime.lib "$go_lib_dir/"
            cp -v "$go_lib_dir"/*.dll $upload_dir
            cp -v "$go_lib_dir"/*.lib $upload_dir
          else
            cp -v -f _deps/onnxruntime-src/lib/libonnxruntime* "$go_lib_dir/" 2>/dev/null || true
            cp -v -f lib/libsherpa-onnx-c-api* "$go_lib_dir/" 2>/dev/null || true
            cp -v -f _deps/onnxruntime-src/lib/libonnxruntime* $upload_dir/ 2>/dev/null || true
            cp -v -f lib/lib*.dylib $upload_dir/ 2>/dev/null || cp -v -f lib/lib*.so $upload_dir/ 2>/dev/null || true
            rm -f ./lib/*.a
          fi

          cd ../scripts/go/_internal/
          go mod tidy
          go build

      - name: Copy DLLs to example directories (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          if [[ ${{ matrix.arch }} == x86 ]]; then
            win_lib_dir=i686-pc-windows-gnu
          else
            win_lib_dir=x86_64-pc-windows-gnu
          fi
          for dir in scripts/go/_internal/*/; do
            if [ -d "$dir" ] && [ -f "$dir/go.mod" ]; then
              cp -v scripts/go/_internal/lib/$win_lib_dir/*.dll "$dir" 2>/dev/null || true
            fi
          done
          for dir in go-api-examples/*/; do
            if [ -d "$dir" ] && [ -f "$dir/go.mod" ]; then
              cp -v scripts/go/_internal/lib/$win_lib_dir/*.dll "$dir" 2>/dev/null || true
            fi
          done

      - name: Remove non-Windows lib dirs before upload
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          # On Windows, remove non-Windows lib dirs and broken symlinks.
          # The upload-artifact action can't stat() broken symlinks.
          cd scripts/go/_internal/lib
          for d in *; do
            if [[ "$d" != "i686-pc-windows-gnu" && "$d" != "x86_64-pc-windows-gnu" ]]; then
              echo "Removing: $d"
              rm -rf "$d"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: go-libs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            scripts/go/_internal/lib
            scripts/go/_internal/*/go.mod
            scripts/go/_internal/*/go.sum
            go-api-examples/

  test:
    needs: build-libs
    name: "Test group ${{ matrix.index }} (${{ matrix.os }} ${{ matrix.arch }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64
          - os: macos-latest
            arch: arm64
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification source-separation"
          - os: macos-latest
            arch: arm64
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: macos-latest
            arch: arm64
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: macos-latest
            arch: arm64
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: macos-latest
            arch: arm64
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: macos-latest
            arch: arm64
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: macos-latest
            arch: arm64
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: macos-latest
            arch: arm64
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: macos-latest
            arch: arm64
            index: 8
            tests: "non-streaming-speaker-diarization"
          # macOS x64
          - os: macos-15-intel
            arch: amd64
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification source-separation"
          - os: macos-15-intel
            arch: amd64
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: macos-15-intel
            arch: amd64
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: macos-15-intel
            arch: amd64
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: macos-15-intel
            arch: amd64
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: macos-15-intel
            arch: amd64
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: macos-15-intel
            arch: amd64
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: macos-15-intel
            arch: amd64
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: macos-15-intel
            arch: amd64
            index: 8
            tests: "non-streaming-speaker-diarization"
          # Linux x64
          - os: ubuntu-latest
            arch: amd64
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification source-separation"
          - os: ubuntu-latest
            arch: amd64
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: ubuntu-latest
            arch: amd64
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: ubuntu-latest
            arch: amd64
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: ubuntu-latest
            arch: amd64
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: ubuntu-latest
            arch: amd64
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: ubuntu-latest
            arch: amd64
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: ubuntu-latest
            arch: amd64
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: ubuntu-latest
            arch: amd64
            index: 8
            tests: "non-streaming-speaker-diarization"
          # Linux arm64
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification source-separation"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: ubuntu-22.04-arm
            arch: arm64
            index: 8
            tests: "non-streaming-speaker-diarization"
          # Windows x64
          - os: windows-2022
            arch: x64
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification source-separation"
          - os: windows-2022
            arch: x64
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: windows-2022
            arch: x64
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: windows-2022
            arch: x64
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: windows-2022
            arch: x64
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: windows-2022
            arch: x64
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: windows-2022
            arch: x64
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: windows-2022
            arch: x64
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: windows-2022
            arch: x64
            index: 8
            tests: "non-streaming-speaker-diarization"
          # Windows x86 (source-separation skipped on x86)
          - os: windows-2022
            arch: x86
            index: 0
            tests: "hello-world non-streaming-decode-files speaker-identification"
          - os: windows-2022
            arch: x86
            index: 1
            tests: "non-streaming-cohere-transcribe-decode-files non-streaming-qwen3-asr-decode-files supertonic-tts non-streaming-moonshine-v2-decode-files"
          - os: windows-2022
            arch: x86
            index: 2
            tests: "non-streaming-fire-red-asr-ctc-decode-files zero-shot-pocket-tts zero-shot-zipvoice-tts non-streaming-funasr-nano-decode-files"
          - os: windows-2022
            arch: x86
            index: 3
            tests: "non-streaming-medasr-ctc-decode-files non-streaming-omnilingual-asr-ctc-decode-files non-streaming-tts streaming-decode-files"
          - os: windows-2022
            arch: x86
            index: 4
            tests: "non-streaming-canary-decode-files speech-enhancement-gtcrn speech-enhancement-dpdfnet streaming-speech-enhancement-gtcrn"
          - os: windows-2022
            arch: x86
            index: 5
            tests: "streaming-speech-enhancement-dpdfnet audio-tagging keyword-spotting-from-file add-punctuation"
          - os: windows-2022
            arch: x86
            index: 6
            tests: "add-punctuation-online non-streaming-speaker-diarization streaming-hlg-decoding"
          - os: windows-2022
            arch: x86
            index: 7
            tests: "non-streaming-speaker-diarization"
          - os: windows-2022
            arch: x86
            index: 8
            tests: "non-streaming-speaker-diarization"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.17'

      - name: Set up MinGW for x86
        if: matrix.os == 'windows-2022' && matrix.arch == 'x86'
        uses: csukuangfj/setup-mingw@v2.2.1
        with:
          platform: x86
          version: '12.2.0'

      - name: Set GOARCH for x86
        if: matrix.os == 'windows-2022' && matrix.arch == 'x86'
        shell: bash
        run: |
          go env -w GOARCH=386
          go env -w CGO_ENABLED=1

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: go-libs-${{ matrix.os }}-${{ matrix.arch }}
          path: .

      - name: Setup local sherpa-onnx Go package
        shell: bash
        run: |
          # Add replace directives so go-api-examples use the local package
          for dir in go-api-examples/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo 'replace github.com/k2-fsa/sherpa-onnx-go/sherpa_onnx => ../../scripts/go/_internal' >> "$dir/go.mod"
            fi
          done

      - name: Run tests
        shell: bash
        run: |
          for test in ${{ matrix.tests }}; do
            echo "=== Running ${test} ==="
            chmod +x .github/scripts/go/${test}.sh
            .github/scripts/go/${test}.sh
            echo "=== ${test} passed ==="
          done
