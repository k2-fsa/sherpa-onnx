name: test-flutter-vad

on:
  push:
    branches:
      - master
      - vad-flutter

  workflow_dispatch:

concurrency:
  group: test-flutter-vad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.demo }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [vad-from-file, vad-from-microphone]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-flutter-vad-${{ matrix.demo }}

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.44.8

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Cache xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework
          key: macos-xcframework-${{ hashFiles('build-macos-shared-sherpa-with-static-onnxruntime.sh', 'CMakeLists.txt') }}
          restore-keys: |
            macos-xcframework-

      - name: Build xcframework from source
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework
        shell: bash
        run: |
          cp -av build-macos-shared-sherpa-with-static-onnxruntime/sherpa-onnx.xcframework flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework
          ls -lh flutter/sherpa_onnx_macos/macos/sherpa_onnx_macos/sherpa-onnx.xcframework/

      - name: Use local sherpa_onnx_macos
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_macos: 1.13.7|  # sherpa_onnx_macos: 1.13.7\n  sherpa_onnx_macos:\n    path: ../sherpa_onnx_macos|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Remove sherpa_onnx_web dependency
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|^  sherpa_onnx_web:.*|  # sherpa_onnx_web: 1.13.7|' pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Copy LICENSE for sherpa_onnx_macos podspec
        shell: bash
        run: |
          cp LICENSE flutter/sherpa_onnx_macos/LICENSE

      - name: Download model
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/assets
          rm -fv .gitkeep
          curl -sSL -o silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh
          cd ..
          ./generate-asset-list.py

      - name: Build Flutter app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd macos && pod install && cd ..
          if [ "${{ matrix.demo }}" = "vad-from-file" ]; then
            # Disable code signing for vad-from-file (CI has no dev certificate, ffmpeg frameworks are unsigned)
            sed -i.bak 's/CODE_SIGN_IDENTITY = "-";/CODE_SIGN_IDENTITY = "-";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/' macos/Runner.xcodeproj/project.pbxproj
            rm -f macos/Runner.xcodeproj/project.pbxproj.bak
          fi
          flutter build macos

          ls -lh build/macos/Build/Products/Release/

      - name: Ad-hoc sign the app
        shell: bash
        run: |
          app_name=$(echo ${{ matrix.demo }} | tr '-' '_')
          app_path=flutter-examples/${{ matrix.demo }}/build/macos/Build/Products/Release/${app_name}.app
          if [ "${{ matrix.demo }}" = "vad-from-file" ]; then
            # vad-from-file: ffmpeg frameworks have non-standard structure,
            # codesign fails on them. Just clear quarantine so macOS allows it.
            xattr -cr "$app_path"
          else
            codesign --force --deep -s - "$app_path"
            xattr -cr "$app_path"
          fi

      - name: Setup tmate session
        # if: true
        if: failure()
        uses: mxschmitt/action-tmate@v3

      - name: Zip app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/build/macos/Build/Products/Release/
          app_name=$(echo ${{ matrix.demo }} | tr '-' '_')
          zip -r -y flutter-${{ matrix.demo }}-macos.zip ${app_name}.app/
          ls -lh flutter-${{ matrix.demo }}-macos.zip

      - name: Release 
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./flutter-examples/${{ matrix.demo }}/build/macos/Build/Products/Release/flutter-${{ matrix.demo }}-macos.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: flutter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.demo }}-macos
          path: flutter-examples/${{ matrix.demo }}/build/macos/Build/Products/Release/flutter-${{ matrix.demo }}-macos.zip

  linux:
    name: Linux (${{ matrix.demo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [vad-from-file, vad-from-microphone]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-flutter-vad-${{ matrix.demo }}

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Display flutter info
        shell: bash
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          flutter doctor

      - name: Build sherpa-onnx from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir build
          cd build
          cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..
          cmake --build . --target install --config Release

      - name: Copy libs
        shell: bash
        run: |
          if [[ $(uname -m) == "aarch64" ]]; then
            arch=aarch64
          else
            arch=x64
          fi
          cp -fv build/install/lib/lib* ./flutter/sherpa_onnx_linux/linux/$arch
          ls -lh ./flutter/sherpa_onnx_linux/linux/$arch

      - name: Use local sherpa_onnx_linux
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|  sherpa_onnx_linux: 1.13.7|  # sherpa_onnx_linux: 1.13.7\n  sherpa_onnx_linux:\n    path: ../sherpa_onnx_linux|' pubspec.yaml
          rm -f pubspec.yaml.bak
          cat pubspec.yaml

      - name: Remove sherpa_onnx_web dependency
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|^  sherpa_onnx_web:.*|  # sherpa_onnx_web: 1.13.7|' pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Download model
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/assets
          rm -fv .gitkeep
          curl -sSL -o silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh
          cd ..
          ./generate-asset-list.py

      - name: Install libmpv (Linux)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Build Flutter app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}

          sed -i.bak 's|sherpa_onnx: 1.13.7|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build linux

          ls -lh build/linux/*/release/bundle/

      - name: Zip app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/build/linux/*/release/
          zip -r -y flutter-${{ matrix.demo }}-linux-x64.zip bundle/
          ls -lh flutter-${{ matrix.demo }}-linux-x64.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./flutter-examples/${{ matrix.demo }}/build/linux/*/release/flutter-${{ matrix.demo }}-linux-x64.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: flutter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.demo }}-linux-x64
          path: flutter-examples/${{ matrix.demo }}/build/linux/*/release/flutter-${{ matrix.demo }}-linux-x64.zip

  windows:
