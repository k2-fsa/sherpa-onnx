      - name: Remove sherpa_onnx_web dependency
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|^  sherpa_onnx_web:.*|  # sherpa_onnx_web: 1.13.7|' pubspec.yaml
