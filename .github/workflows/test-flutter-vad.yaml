          ls -lh build/windows/x64/runner/Release/

      - name: Zip app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/build/windows/x64/runner/
          powershell -Command "Compress-Archive -Path Release -DestinationPath flutter-${{ matrix.demo }}-win-x64.zip"
          ls -lh flutter-${{ matrix.demo }}-win-x64.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
