          dart --version
          flutter doctor

      - name: Build WASM module
        shell: bash
        run: |
          ./build-wasm-simd-web.sh

      - name: Copy WASM assets to web plugin
        shell: bash
        run: |
          ./build-flutter-web-wasm.sh

      - name: Download model
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/assets
          rm -fv .gitkeep
          curl -sSL -O https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${{ matrix.tts_tarball }}
          tar xf ${{ matrix.tts_tarball }}
          rm ${{ matrix.tts_tarball }}
          ${{ matrix.tts_extra_cmd }}
          ${{ matrix.tts_cleanup_cmd }}
          cd ..
          ./generate-asset-list.py

      - name: Set selectedModelIndex
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}
          sed -i.bak "s|const int selectedModelIndex = [0-9]*;|const int selectedModelIndex = ${{ matrix.tts_model_index }};|" lib/model_config.dart
          rm -f lib/model_config.dart.bak
          grep 'selectedModelIndex' lib/model_config.dart


      - name: Use local sherpa_onnx_web
        shell: bash
        run: |
          cd flutter/sherpa_onnx
          sed -i.bak 's|^  sherpa_onnx_web:.*|  # sherpa_onnx_web: 1.13.8\n  sherpa_onnx_web:\n    path: ../sherpa_onnx_web|' pubspec.yaml
          rm -f pubspec.yaml.bak

      - name: Build Flutter web app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}

          sed -i.bak 's|sherpa_onnx: 1.13.8|sherpa_onnx:\n    path: ../../flutter/sherpa_onnx|' pubspec.yaml
          rm -f pubspec.yaml.bak

          flutter pub get
          flutter build web

          ls -lh build/web/

      - name: Zip web app
        shell: bash
        run: |
          cd flutter-examples/${{ matrix.demo }}/build/
          # Rename the folder so the extracted app carries the model name.
          mv web tts-${{ matrix.tts_model_name }}
          zip -r -y flutter-${{ matrix.demo }}-${{ matrix.tts_model_name }}-web.zip tts-${{ matrix.tts_model_name }}/
          ls -lh flutter-${{ matrix.demo }}-${{ matrix.tts_model_name }}-web.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./flutter-examples/${{ matrix.demo }}/build/flutter-${{ matrix.demo }}-${{ matrix.tts_model_name }}-web.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: flutter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.demo }}-${{ matrix.tts_model_name }}-web
          path: flutter-examples/${{ matrix.demo }}/build/flutter-${{ matrix.demo }}-${{ matrix.tts_model_name }}-web.zip
