name: test-tauri-hello-world

on:
  push:
    branches:
      - master
      - rust-ios

  workflow_dispatch:

concurrency:
  group: test-tauri-hello-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.arch }}, ${{ matrix.link_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            link_mode: static
          - arch: arm64
            os: macos-latest
            link_mode: shared
          - arch: x64
            os: macos-15-intel
            link_mode: static
          - arch: x64
            os: macos-15-intel
            link_mode: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-tauri-${{ matrix.link_mode }}

      - name: Build sherpa-onnx from source
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir build
          cd build
          if [[ "${{ matrix.link_mode }}" == "shared" ]]; then
            build_shared=ON
          else
            build_shared=OFF
          fi
          cmake \
            -DBUILD_SHARED_LIBS=$build_shared \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..
          cmake --build . --target install --config Release

      - name: Set library paths
        shell: bash
        run: |
          echo "SHERPA_ONNX_LIB_DIR=$PWD/build/install/lib" >> "$GITHUB_ENV"
          if [[ "${{ matrix.link_mode }}" == "shared" ]]; then
            echo "DYLD_LIBRARY_PATH=$PWD/build/install/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Use local sherpa-onnx crates
        shell: bash
        run: |
          mkdir -p tauri-examples/hello_world/src-tauri/.cargo
          cat > tauri-examples/hello_world/src-tauri/.cargo/config.toml <<'EOF'
          [patch.crates-io]
          sherpa-onnx = { path = "../../../sherpa-onnx/rust/sherpa-onnx" }
          sherpa-onnx-sys = { path = "../../../sherpa-onnx/rust/sherpa-onnx-sys" }
          EOF

      - name: Set sherpa-onnx feature for shared mode
        if: matrix.link_mode == 'shared'
        shell: bash
        run: |
          cd tauri-examples/hello_world/src-tauri
          sed -i.bak 's/sherpa-onnx = "1.13.7"/sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }/' Cargo.toml
          rm -f Cargo.toml.bak
          cat Cargo.toml

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/hello_world/src-tauri/target/release/bundle/

      - name: Ad-hoc sign the app
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          app_path=$(find tauri-examples/hello_world/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            codesign --force --deep -s - "$app_path"
            xattr -cr "$app_path"
          fi

      - name: Zip app
        shell: bash
        run: |
          zip_name="tauri-hello-world-macos-${{ matrix.arch }}-${{ matrix.link_mode }}.zip"
          app_path=$(find tauri-examples/hello_world/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            app_name=$(basename "$app_path" .app)
            cd tauri-examples/hello_world/src-tauri/target/release/bundle/macos/
            rm -rf tauri-hello-world-macos-${{ matrix.arch }}
            mkdir -p tauri-hello-world-macos-${{ matrix.arch }}
            mv "${app_name}.app" tauri-hello-world-macos-${{ matrix.arch }}/
            if [[ "${{ matrix.link_mode }}" == "shared" ]]; then
              cp -v $GITHUB_WORKSPACE/build/install/lib/*.dylib tauri-hello-world-macos-${{ matrix.arch }}/
            fi
            zip -r -y "$zip_name" tauri-hello-world-macos-${{ matrix.arch }}/
            ls -lh "$zip_name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-macos-${{ matrix.arch }}-${{ matrix.link_mode }}
          path: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}-${{ matrix.link_mode }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}-${{ matrix.link_mode }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}-${{ matrix.link_mode }}.zip
          tag: tauri

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-tauri

      - name: Cache iOS xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: build-ios-shared-sherpa-with-static-onnxruntime/SherpaOnnxC.xcframework
          key: ios-xcframework-${{ hashFiles('CMakeLists.txt') }}

      - name: Build iOS xcframework from source
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios-shared-sherpa-with-static-onnxruntime.sh

      - name: Copy xcframework to Tauri project
        shell: bash
        run: |
          cp -av build-ios-shared-sherpa-with-static-onnxruntime/SherpaOnnxC.xcframework \
            tauri-examples/hello_world/src-tauri/sherpa-onnx.xcframework

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Use local sherpa-onnx crates
        shell: bash
        run: |
          mkdir -p tauri-examples/hello_world/src-tauri/.cargo
          cat > tauri-examples/hello_world/src-tauri/.cargo/config.toml <<'EOF'
          [patch.crates-io]
          sherpa-onnx = { path = "../../../sherpa-onnx/rust/sherpa-onnx" }
          sherpa-onnx-sys = { path = "../../../sherpa-onnx/rust/sherpa-onnx-sys" }
          EOF

      - name: Init iOS
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri ios init

      - name: Build iOS for device
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri ios build --target aarch64 --no-sign

      - name: Build iOS for simulator
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri ios build --target aarch64-sim --no-sign

      - name: Package simulator app
        shell: bash
        run: |
          cd tauri-examples/hello_world/src-tauri
          app_path=$(find . -name "hello_world.app" 2>/dev/null | head -1)
          if [ -n "$app_path" ]; then
            zip_name="tauri-hello-world-ios-simulator.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_name"
            ls -lh "$zip_name"
          fi

      - name: Rename IPA
        shell: bash
        run: |
          ipa=$(find tauri-examples/hello_world/src-tauri -name "*.ipa" | head -1)
          if [ -n "$ipa" ]; then
            cp "$ipa" tauri-hello-world-ios-device.ipa
            ls -lh tauri-hello-world-ios-device.ipa
          fi

      - name: Show artifacts
        shell: bash
        run: |
          ls -lh tauri-hello-world-ios-device.ipa tauri-examples/hello_world/src-tauri/tauri-hello-world-ios-simulator.zip 2>/dev/null

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-ios-device
          path: tauri-hello-world-ios-device.ipa
          if-no-files-found: ignore

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-ios-simulator
          path: tauri-examples/hello_world/src-tauri/tauri-hello-world-ios-simulator.zip
          if-no-files-found: ignore

      - name: Release device IPA
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          file: tauri-hello-world-ios-device.ipa
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release device IPA
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          file: tauri-hello-world-ios-device.ipa
          tag: tauri

      - name: Release simulator app
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/tauri-hello-world-ios-simulator.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release simulator app
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/tauri-hello-world-ios-simulator.zip
          tag: tauri

