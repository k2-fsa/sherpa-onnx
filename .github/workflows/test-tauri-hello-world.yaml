          sed -i.bak 's/sherpa-onnx = "1.13.7"/sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }/' Cargo.toml
          rm -f Cargo.toml.bak
          cat Cargo.toml

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/hello_world/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory"
          ls -lh tauri-examples/hello_world/src-tauri/target/release/hello_world 2>/dev/null || true

      - name: Zip app
        shell: bash
        run: |
          zip_name="tauri-hello-world-linux-${{ matrix.arch }}-${{ matrix.link_mode }}.zip"
          dir_name="tauri-hello-world-linux-${{ matrix.arch }}-${{ matrix.link_mode }}"
          cd tauri-examples/hello_world/src-tauri/target/release/
          rm -rf "$dir_name"
          mkdir -p "$dir_name"
          cp hello_world "$dir_name/"
          if [[ "${{ matrix.link_mode }}" == "shared" ]]; then
            cp *.so "$dir_name/"
          fi
          zip -r -y "$GITHUB_WORKSPACE/$zip_name" "$dir_name"
          ls -lh "$GITHUB_WORKSPACE/$zip_name"

      - name: Upload artifact
