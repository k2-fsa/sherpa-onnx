name: test-tauri-hello-world-crate

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: test-tauri-hello-world-crate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('tauri-examples/hello_world/package-lock.json') }}

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Cache Tauri build
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/src-tauri/target
          key: tauri-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tauri-examples/hello_world/src-tauri/Cargo.lock', 'tauri-examples/hello_world/src-tauri/Cargo.toml') }}

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/hello_world/src-tauri/target/release/bundle/

      - name: Ad-hoc sign the app
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          app_path=$(find tauri-examples/hello_world/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            codesign --force --deep -s - "$app_path"
            xattr -cr "$app_path"
          fi

      - name: Zip app
        shell: bash
        run: |
          app_path=$(find tauri-examples/hello_world/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$app_path" ]; then
            app_name=$(basename "$app_path" .app)
            cd tauri-examples/hello_world/src-tauri/target/release/bundle/macos/
            mkdir -p tauri-hello-world-macos-${{ matrix.arch }}
            mv "${app_name}.app" tauri-hello-world-macos-${{ matrix.arch }}/
            zip -r -y tauri-hello-world-macos-${{ matrix.arch }}.zip tauri-hello-world-macos-${{ matrix.arch }}/
            ls -lh tauri-hello-world-macos-${{ matrix.arch }}.zip
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-crate-macos-${{ matrix.arch }}
          path: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-examples/hello_world/src-tauri/target/release/bundle/macos/tauri-hello-world-macos-${{ matrix.arch }}.zip
          tag: tauri

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Init iOS
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri ios init

      - name: Build iOS
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri ios build --no-sign

      - name: Show artifacts
        shell: bash
        run: |
          find tauri-examples/hello_world/src-tauri/target -name "*.ipa" -o -name "*.app" 2>/dev/null | head -10
          ls -lhR tauri-examples/hello_world/src-tauri/target/apple/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-crate-ios
          path: tauri-examples/hello_world/src-tauri/target/apple/**/*.ipa
          if-no-files-found: ignore

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('tauri-examples/hello_world/package-lock.json') }}

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Cache Tauri build
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/src-tauri/target
          key: tauri-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tauri-examples/hello_world/src-tauri/Cargo.lock', 'tauri-examples/hello_world/src-tauri/Cargo.toml') }}

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/hello_world/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory"
          ls -lh tauri-examples/hello_world/src-tauri/target/release/hello_world 2>/dev/null || true

      - name: Zip app
        shell: bash
        run: |
          app_dir=$(find tauri-examples/hello_world/src-tauri/target/release/bundle -maxdepth 1 -type d -name "app" 2>/dev/null | head -1)
          if [ -n "$app_dir" ]; then
            cd "$app_dir"
            zip -r -y "$GITHUB_WORKSPACE/tauri-hello-world-linux-${{ matrix.arch }}.zip" .
          else
            cd tauri-examples/hello_world/src-tauri/target/release/
            zip -r -y "$GITHUB_WORKSPACE/tauri-hello-world-linux-${{ matrix.arch }}.zip" hello_world
          fi
          ls -lh "$GITHUB_WORKSPACE/tauri-hello-world-linux-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-crate-linux-${{ matrix.arch }}
          path: tauri-hello-world-linux-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-linux-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-linux-${{ matrix.arch }}.zip
          tag: tauri

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      - name: Select MSVC linker
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            $linker = Join-Path $env:VCToolsInstallDir 'bin\HostX64\ARM64\link.exe'
            $env_var = "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"
          } else {
            $linker = Join-Path $env:VCToolsInstallDir 'bin\HostX64\x64\link.exe'
            $env_var = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
          }
          if (-not (Test-Path $linker)) {
            throw "MSVC linker not found: $linker"
          }
          "$env_var=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using linker: $linker"
          & where.exe link

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('tauri-examples/hello_world/package-lock.json') }}

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Cache Tauri build
        uses: actions/cache@v4
        with:
          path: tauri-examples/hello_world/src-tauri/target
          key: tauri-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tauri-examples/hello_world/src-tauri/Cargo.lock', 'tauri-examples/hello_world/src-tauri/Cargo.toml') }}

      - name: Build
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm run build

      - name: Show artifacts
        shell: bash
        run: |
          ls -lhR tauri-examples/hello_world/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory"
          ls -lh tauri-examples/hello_world/src-tauri/target/release/hello_world.exe 2>/dev/null || true

      - name: Zip app
        shell: bash
        run: |
          app_dir=$(find tauri-examples/hello_world/src-tauri/target/release/bundle -maxdepth 1 -type d -name "app" 2>/dev/null | head -1)
          if [ -n "$app_dir" ]; then
            cd "$app_dir"
            zip -r -y "$GITHUB_WORKSPACE/tauri-hello-world-win-${{ matrix.arch }}.zip" .
          else
            cd tauri-examples/hello_world/src-tauri/target/release/
            zip -r -y "$GITHUB_WORKSPACE/tauri-hello-world-win-${{ matrix.arch }}.zip" hello_world.exe
          fi
          ls -lh "$GITHUB_WORKSPACE/tauri-hello-world-win-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-crate-win-${{ matrix.arch }}
          path: tauri-hello-world-win-${{ matrix.arch }}.zip

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-win-${{ matrix.arch }}.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-win-${{ matrix.arch }}.zip
          tag: tauri

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
          - abi: x86_64
            rust_target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Tauri CLI
        id: cache-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Install npm dependencies
        shell: bash
        run: |
          cd tauri-examples/hello_world
          npm install

      - name: Init Android
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri android init

      - name: Build Android
        shell: bash
        run: |
          cd tauri-examples/hello_world
          cargo-tauri android build --target ${{ matrix.abi }}

      - name: Show artifacts
        shell: bash
        run: |
          find tauri-examples/hello_world/src-tauri/target -name "*.apk" 2>/dev/null | head -10

      - name: Rename APK
        shell: bash
        run: |
          apk=$(find tauri-examples/hello_world/src-tauri/target -name "*.apk" | head -1)
          if [ -n "$apk" ]; then
            cp "$apk" "tauri-hello-world-${{ matrix.abi }}.apk"
            ls -lh "tauri-hello-world-${{ matrix.abi }}.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-hello-world-crate-android-${{ matrix.abi }}
          path: tauri-hello-world-${{ matrix.abi }}.apk
          if-no-files-found: ignore

      - name: Release
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-${{ matrix.abi }}.apk
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: tauri

      - name: Release
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: tauri-hello-world-${{ matrix.abi }}.apk
          tag: tauri
