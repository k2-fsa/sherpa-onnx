name: build-xcframework

on:
  push:
    branches:
      - master
      - macos-xcframework
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:

concurrency:
  group: build-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ios_static_xcframework:
    name: ios-static
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-static

      - name: Build iOS static
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios.sh

      - name: Display artifacts
        shell: bash
        run: |
          ls -lh build-ios/*.xcframework.zip

      - name: Test xcframework
        shell: bash
        run: |
          mkdir -p /tmp/test-xcframework
          cd /tmp/test-xcframework
          unzip -o $GITHUB_WORKSPACE/build-ios/*.xcframework.zip -d .
          ls -lh sherpa-onnx.xcframework/

          # Find the framework directory (use simulator slice)
          fw_dir=$(find sherpa-onnx.xcframework -path "*simulator*" -name "sherpa-onnx.framework" | head -1)
          header_dir=$(find sherpa-onnx.xcframework -path "*simulator*" -name "c-api.h" -exec dirname {} \; | head -1)

          echo "fw_dir: $fw_dir"
          echo "header_dir: $header_dir"

          # Headers are at Headers/sherpa-onnx/c-api/ inside the framework
          include_dir="$header_dir/../.."

          # Use onnxruntime simulator slice from the build directory
          ort_framework=$GITHUB_WORKSPACE/build-ios/ios-onnxruntime/onnxruntime.xcframework/ios-arm64_x86_64-simulator

          # Compile for iOS simulator
          xcrun -sdk iphonesimulator clang -o version-c-api $GITHUB_WORKSPACE/c-api-examples/version-c-api.c \
            -target arm64-apple-ios16.0-simulator \
            -I "$include_dir" \
            -F "$(dirname $fw_dir)" \
            -framework sherpa-onnx \
            -F "$ort_framework" \
            -framework onnxruntime \
            -framework CoreML \
            -lc++

          # Boot simulator and run
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" ./version-c-api

      - name: Upload xcframework.zip
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-ios-static-xcframework
          path: ./build-ios/*.xcframework.zip

      - name: Release xcframework
        if: github.repository_owner == 'k2-fsa' && github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./build-ios/*.xcframework.zip
          tag: xcframework

      - name: Release xcframework
        # if: github.repository_owner == 'csukuangfj' && github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./build-ios/*.xcframework.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: xcframework

      # https://huggingface.co/docs/hub/spaces-github-actions
      - name: Publish to huggingface
        if: (github.repository_owner == 'csukuangfj' || github.repository_owner == 'k2-fsa') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_CLONE_PROTECTION_ACTIVE=false
            GIT_LFS_SKIP_SMUDGE=1 git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/sherpa-onnx-libs huggingface

            cd huggingface

            cp -v ../build-ios/*.xcframework.zip ./

            git status
            git lfs track "*.zip"

            git add .

            SHERPA_ONNX_VERSION=v$(grep "SHERPA_ONNX_VERSION" ../CMakeLists.txt | cut -d " " -f 2 | cut -d '"' -f 2)
            git commit -m "upload sherpa-onnx-${SHERPA_ONNX_VERSION} ios-static xcframework"

            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/sherpa-onnx-libs main


