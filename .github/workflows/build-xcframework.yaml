name: build-xcframework

on:
  push:
    branches:
      - master
      - macos-xcframework-2
    tags:
      - 'release-v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:

concurrency:
  group: build-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ios_static_xcframework:
    name: ios-static
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-static

      - name: Build iOS static
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios.sh

      - name: Display artifacts
        shell: bash
        run: |
          ls -lh build-ios/*.xcframework.zip

      - name: Test xcframework
        shell: bash
        run: |
          mkdir -p /tmp/test-xcframework
          cd /tmp/test-xcframework
          unzip -o $GITHUB_WORKSPACE/build-ios/*.xcframework.zip -d .
          ls -lh sherpa-onnx.xcframework/

          # Verify xcframework structure (framework bundle)
          fw_path=$(find sherpa-onnx.xcframework -path "*simulator*" -name "SherpaOnnxC.framework" -type d | head -1)
          echo "fw_path: $fw_path"

          test -f "$fw_path/SherpaOnnxC" || { echo "Binary not found"; exit 1; }
          test -f "$fw_path/Headers/sherpa-onnx/c-api/c-api.h" || { echo "Header not found"; exit 1; }
          test -f "$fw_path/Modules/module.modulemap" || { echo "Modulemap not found"; exit 1; }
          test -f "$fw_path/Info.plist" || { echo "Info.plist not found"; exit 1; }

          echo "iOS static xcframework structure verified"

      - name: Upload xcframework.zip
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-ios-static-xcframework
          path: ./build-ios/*.xcframework.zip

  build_ios_shared_xcframework:
    name: ios-shared
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-shared

      - name: Build iOS shared
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-ios-shared.sh

      - name: Display artifacts
        shell: bash
        run: |
          ls -lh build-ios-shared/*.xcframework.zip

      - name: Test xcframework
        shell: bash
        run: |
          mkdir -p /tmp/test-xcframework
          cd /tmp/test-xcframework
          unzip -o $GITHUB_WORKSPACE/build-ios-shared/*.xcframework.zip -d .
          ls -lh sherpa-onnx.xcframework/

          # Verify xcframework structure (framework bundle)
          fw_path=$(find sherpa-onnx.xcframework -path "*simulator*" -name "SherpaOnnxC.framework" -type d | head -1)
          echo "fw_path: $fw_path"

          test -f "$fw_path/SherpaOnnxC" || { echo "Binary not found"; exit 1; }
          test -f "$fw_path/Headers/sherpa-onnx/c-api/c-api.h" || { echo "Header not found"; exit 1; }
          test -f "$fw_path/Modules/module.modulemap" || { echo "Modulemap not found"; exit 1; }
          test -f "$fw_path/Info.plist" || { echo "Info.plist not found"; exit 1; }

          echo "iOS shared xcframework structure verified"

      - name: Upload xcframework.zip
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-ios-shared-xcframework
          path: ./build-ios-shared/*.xcframework.zip

  build_macos_static_xcframework:
    name: macos-static
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-static

      - name: Build macOS static
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos.sh

      - name: Display artifacts
        shell: bash
        run: |
          ls -lh build-macos/*.xcframework.zip

      - name: Test xcframework
        shell: bash
        run: |
          mkdir -p /tmp/test-xcframework
          cd /tmp/test-xcframework
          unzip -o $GITHUB_WORKSPACE/build-macos/*.xcframework.zip -d .
          ls -lh sherpa-onnx.xcframework/

          # Find the framework bundle
          fw_path=$(find sherpa-onnx.xcframework -name "SherpaOnnxC.framework" -type d | head -1)
          echo "fw_path: $fw_path"

          test -f "$fw_path/Versions/A/SherpaOnnxC" || { echo "Binary not found"; exit 1; }
          test -f "$fw_path/Versions/A/Headers/sherpa-onnx/c-api/c-api.h" || { echo "Header not found"; exit 1; }
          test -f "$fw_path/Versions/A/Modules/module.modulemap" || { echo "Modulemap not found"; exit 1; }

          # Use onnxruntime from the build directory
          ort_lib=$GITHUB_WORKSPACE/build-macos/_deps/onnxruntime-src/lib

          # Headers are at Headers/sherpa-onnx/c-api/c-api.h
          # Include path should be Headers/ so #include "sherpa-onnx/c-api/c-api.h" works
          clang -o version-c-api $GITHUB_WORKSPACE/c-api-examples/version-c-api.c \
            -I "$fw_path/Headers" \
            "$fw_path/Versions/A/SherpaOnnxC" \
            -L "$ort_lib" \
            -l onnxruntime \
            -framework CoreFoundation \
            -framework Foundation \
            -lc++

          ./version-c-api

      - name: Upload xcframework.zip
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-macos-static-xcframework
          path: ./build-macos/*.xcframework.zip

  build_macos_shared_xcframework:
    name: macos-shared
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-shared

      - name: Build macOS shared
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./build-macos-shared.sh

      - name: Display build directory
        shell: bash
        run: |
          ls -lh build-macos-shared

      - name: Display artifacts
        shell: bash
        run: |
          ls -lh build-macos-shared/*.xcframework.zip
          unzip -l build-macos-shared/*.xcframework.zip

      - name: Test xcframework
        shell: bash
        run: |
          mkdir -p /tmp/test-xcframework
          cd /tmp/test-xcframework
          unzip -o $GITHUB_WORKSPACE/build-macos-shared/*.xcframework.zip -d .
          ls -lh sherpa-onnx.xcframework/

          # Find the framework bundle
          fw_path=$(find sherpa-onnx.xcframework -name "SherpaOnnxC.framework" -type d | head -1)
          echo "fw_path: $fw_path"

          test -f "$fw_path/Versions/A/SherpaOnnxC" || { echo "Binary not found"; exit 1; }
          test -f "$fw_path/Versions/A/Headers/sherpa-onnx/c-api/c-api.h" || { echo "Header not found"; exit 1; }
          test -f "$fw_path/Versions/A/Modules/module.modulemap" || { echo "Modulemap not found"; exit 1; }

          # Use onnxruntime from the build directory
          ort_lib=$GITHUB_WORKSPACE/build-macos-shared/_deps/onnxruntime-src/lib

          # Headers are at Headers/sherpa-onnx/c-api/c-api.h
          # Include path should be Headers/ so #include "sherpa-onnx/c-api/c-api.h" works
          # rpath must point to the directory containing SherpaOnnxC.framework/
          fw_parent=$(dirname "$fw_path")
          clang -o version-c-api $GITHUB_WORKSPACE/c-api-examples/version-c-api.c \
            -I "$fw_path/Headers" \
            "$fw_path/Versions/A/SherpaOnnxC" \
            -L "$ort_lib" \
            -l onnxruntime \
            -lc++ \
            -Wl,-rpath,"$fw_parent" \
            -Wl,-rpath,"$ort_lib"

          ./version-c-api

      - name: Upload xcframework.zip
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-macos-shared-xcframework
          path: ./build-macos-shared/*.xcframework.zip

  test_spm:
    name: test-spm
    needs:
      - build_ios_static_xcframework
      - build_ios_shared_xcframework
      - build_macos_static_xcframework
      - build_macos_shared_xcframework
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download xcframework artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare local xcframeworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-macos build-ios build-macos-shared build-ios-shared

          # Extract static xcframeworks
          unzip -o artifacts/sherpa-onnx-macos-static-xcframework/*.zip -d build-macos/
          unzip -o artifacts/sherpa-onnx-ios-static-xcframework/*.zip -d build-ios/

          # Extract shared xcframeworks
          unzip -o artifacts/sherpa-onnx-macos-shared-xcframework/*.zip -d build-macos-shared/
          unzip -o artifacts/sherpa-onnx-ios-shared-xcframework/*.zip -d build-ios-shared/

          echo "=== macOS static xcframework ==="
          ls -lh build-macos/sherpa-onnx.xcframework/
          echo "=== iOS static xcframework ==="
          ls -lh build-ios/sherpa-onnx.xcframework/
          echo "=== macOS shared xcframework ==="
          ls -lh build-macos-shared/sherpa-onnx.xcframework/
          echo "=== iOS shared xcframework ==="
          ls -lh build-ios-shared/sherpa-onnx.xcframework/

      - name: Test SPM macOS (static)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/macOS

          # Patch Package.swift to use local package
          sed -i.bak 's|.package(url: "https://github.com/k2-fsa/sherpa-onnx", branch: "master")|.package(path: "../../")|' Package.swift

          # Patch root Package.swift to use local xcframework paths
          cd ../..
          cp Package.swift Package.swift.bak
          python3 -c "
          import re
          text = open('Package.swift').read()
          text = re.sub(r'url: \"https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v[0-9.]+-macos-static.xcframework.zip\",', 'path: \"build-macos/sherpa-onnx.xcframework\",', text)
          text = re.sub(r'url: \"https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v[0-9.]+-ios-static.xcframework.zip\",', 'path: \"build-ios/sherpa-onnx.xcframework\",', text)
          text = re.sub(r'\n\s*checksum: \"[a-f0-9]+\",?\n', '\n', text)
          open('Package.swift', 'w').write(text)
          "
          cd spm-examples/macOS

          echo "=== Package.swift ==="
          cat Package.swift
          echo "=== Root Package.swift ==="
          cat ../../Package.swift

          rm -rf .build
          swift build --verbose
          swift run SherpaOnnxExample

      - name: Test SPM iOS (static)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          # Patch Package.swift to use local package
          sed -i.bak 's|.package(url: "https://github.com/k2-fsa/sherpa-onnx", branch: "master")|.package(path: "../../")|' Package.swift

          echo "=== Package.swift ==="
          cat Package.swift

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme SherpaOnnxExample \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -verbose \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/SherpaOnnxExample" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

      - name: Test SPM macOS (shared)
        shell: bash
        run: |
          set -euo pipefail

          # Swap static xcframework with shared
          rm -rf build-macos/sherpa-onnx.xcframework
          cp -a build-macos-shared/sherpa-onnx.xcframework build-macos/

          echo "=== Shared macOS xcframework ==="
          ls -lh build-macos/sherpa-onnx.xcframework/

          cd spm-examples/macOS
          rm -rf .build
          swift build --verbose
          swift run SherpaOnnxExample

      - name: Test SPM iOS (shared)
        shell: bash
        run: |
          set -euo pipefail

          # Swap static xcframework with shared
          rm -rf build-ios/sherpa-onnx.xcframework
          cp -a build-ios-shared/sherpa-onnx.xcframework build-ios/

          echo "=== Shared iOS xcframework ==="
          ls -lh build-ios/sherpa-onnx.xcframework/

          cd spm-examples/iOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme SherpaOnnxExample \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -verbose \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/SherpaOnnxExample" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

      - name: Test iOS app (local SPM)
        shell: bash
        run: |
          set -euo pipefail

          # Patch ios-swiftui/ios-swift xcodeproj files to use local package
          find ios-swiftui ios-swift -name "project.pbxproj" -exec sed -i '' \
            -e 's|isa = XCRemoteSwiftPackageReference|isa = XCLocalSwiftPackageReference|' \
            -e 's|repositoryURL = "https://github.com/k2-fsa/sherpa-onnx"|relativePath = ../../|' \
            -e '/requirement = {/,/};/d' \
            {} +

          echo "=== Building SherpaOnnxAsr (local SPM) ==="
          cd ios-swiftui/SherpaOnnxAsr
          xcodebuild -project SherpaOnnxAsr.xcodeproj \
            -scheme SherpaOnnxAsr \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      - name: Restore modified files
        if: always()
        shell: bash
        run: |
          [ -f spm-examples/macOS/Package.swift.bak ] && mv spm-examples/macOS/Package.swift.bak spm-examples/macOS/Package.swift || true
          [ -f Package.swift.bak ] && mv Package.swift.bak Package.swift || true
          [ -f spm-examples/iOS/Package.swift.bak ] && mv spm-examples/iOS/Package.swift.bak spm-examples/iOS/Package.swift || true
          # Restore xcodeproj files patched by ios.yaml test
          git checkout -- ios-swiftui/ ios-swift/ 2>/dev/null || true

  release:
    name: release
    needs:
      - build_ios_static_xcframework
      - build_ios_shared_xcframework
      - build_macos_static_xcframework
      - build_macos_shared_xcframework
      - test_spm
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all xcframework artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Release xcframework (k2-fsa)
        if: github.repository_owner == 'k2-fsa'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: false
          file: artifacts/**/*.xcframework.zip
          tag: xcframework

      - name: Release xcframework (csukuangfj)
        if: github.repository_owner == 'csukuangfj'
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: false
          file: artifacts/**/*.xcframework.zip
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: xcframework
