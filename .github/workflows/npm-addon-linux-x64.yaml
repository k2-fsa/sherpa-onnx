name: npm-addon-linux-x64

on:
  push:
    branches:
      - node-addon
  workflow_dispatch:

concurrency:
  group: npm-addon-linux-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  npm-addon-linux-x64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show .npmrc
        shell: bash
        run: |
          echo $PWD
          echo $HOME

          find $HOME -name .npmrc

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show .npmrc
        shell: bash
        run: |
          echo $PWD
          echo $HOME

          find $HOME -name .npmrc

          cat /home/runner/work/_temp/.npmrc
          cp -v /home/runner/work/_temp/.npmrc ./

      # Build the shared libs AND compile sherpa-onnx.node inside the
      # manylinux2014 container: the node-addon must be built with the old
      # toolchain as well, otherwise it links against the runner's libstdc++
      # and requires CXXABI_1.3.15 (GCC 13), which breaks older distros,
      # e.g. Debian 12, see
      # https://github.com/k2-fsa/sherpa-onnx/issues/4272
      - name: Build sherpa-onnx (docker manually)
        shell: bash
        run: |
          docker run --rm \
              --volume ${{ github.workspace }}/:/shared/ \
              -w /shared \
              --platform linux/amd64 \
              quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              cp /shared/.npmrc ~/

              cat ~/.npmrc

              echo $HOME
              uname -a
              cat /etc/*release
              gcc --version
              cmake --version

              curl -sL https://rpm.nodesource.com/setup_16.x | bash -
              yum install -y nodejs

              node --version

              cd /shared

              mkdir build
              cd build
              cmake \
                -DCMAKE_INSTALL_PREFIX=./install \
                -DBUILD_SHARED_LIBS=ON \
                -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
                -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
                -DSHERPA_ONNX_ENABLE_BINARY=OFF \
                ..

              make -j2
              make install
              cd ..

              d=$PWD
              export SHERPA_ONNX_INSTALL_DIR=$d/build/install

              ls -lh /shared/build

              pushd scripts/node-addon-api/
              npm i

              ./node_modules/.bin/cmake-js compile --log-level verbose
              popd

              owner=${{ github.repository_owner }}
              export owner

              echo "---"
              ls -lh build/install/lib/
              sudo chown -R runner ./build
              echo "---"
              ls -lh build/install/lib/
              echo "---"

              .github/scripts/node-addon/run.sh

              ls -lh ./sherpa-onnx-node

              tar czvf sherpa-onnx-linux-x64.tgz sherpa-onnx-node
            '

      # Show the toolchain baseline of the built addon and shared lib
      # (outside the docker), see
      # https://github.com/k2-fsa/sherpa-onnx/issues/4272
      - name: Show CXXABI/GLIBC requirements
        shell: bash
        run: |
          echo "CXXABI versions in sherpa-onnx.node:"
          strings scripts/node-addon-api/build/Release/sherpa-onnx.node | grep -oE 'CXXABI_1\.3\.[0-9]+' | sort -V -u | tail -1 || true

          echo "GLIBC versions in sherpa-onnx.node:"
          strings scripts/node-addon-api/build/Release/sherpa-onnx.node | grep ^GLIBC || true

          echo "CXXABI versions in libsherpa-onnx-c-api.so:"
          strings build/install/lib/libsherpa-onnx-c-api.so | grep -oE 'CXXABI_1\.3\.[0-9]+' | sort -V -u | tail -1 || true

          echo "GLIBC versions in libsherpa-onnx-c-api.so:"
          strings build/install/lib/libsherpa-onnx-c-api.so | grep ^GLIBC || true

          echo "Max CXXABI version in libonnxruntime.so:"
          strings build/install/lib/libonnxruntime.so | grep -oE 'CXXABI_1\.3\.[0-9]+' | sort -V -u | tail -1 || true

          echo "Max GLIBC version in libonnxruntime.so:"
          strings build/install/lib/libonnxruntime.so | grep -oE 'GLIBC_2\.[0-9.]+' | sort -V -u | tail -1 || true

          echo "Max GLIBCXX version in libonnxruntime.so:"
          strings build/install/lib/libonnxruntime.so | grep -oE 'GLIBCXX_[0-9.]+' | sort -V -u | tail -1 || true

      - name: Display files to be published
        shell: bash
        run: |
          ls -lh ./sherpa-onnx-node
          tar cjvf ./sherpa-onnx-node.tar.bz2 ./sherpa-onnx-node

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-linux-x64
          path: ./sherpa-onnx-node.tar.bz2

      - name: Publish
        shell: bash
        run: |
          cd ./sherpa-onnx-node
          # https://docs.npmjs.com/trusted-publishers
          npm publish --access public
