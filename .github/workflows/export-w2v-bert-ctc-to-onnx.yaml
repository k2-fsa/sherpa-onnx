name: export-w2v-bert-ctc-to-onnx

on:
  pull_request:
    paths:
      - 'scripts/w2v-bert/**'
      - '.github/workflows/export-w2v-bert-ctc-to-onnx.yaml'
  workflow_dispatch:

concurrency:
  group: export-w2v-bert-ctc-to-onnx-${{ github.ref }}
  cancel-in-progress: true

# The release and Hugging Face steps use their own tokens from secrets.
permissions:
  contents: read

jobs:
  export-w2v-bert-ctc-to-onnx:
    name: export w2v-bert ctc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          # run.sh installs packages from PyPI; keep the token out of them.
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Export and test
        shell: bash
        run: |
          cd scripts/w2v-bert
          ./run.sh

      - name: Collect fp32 files
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd scripts/w2v-bert

          d=sherpa-onnx-w2v-bert-ctc-gl-2026-11-20
          mkdir -p $d/test_wavs

          cp -v model.onnx model.weights tokens.txt README.md $d
          cp -v *.wav transcript.txt $d/test_wavs/

          ls -lh $d
          mv $d ../..

      - name: Collect int8 files
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd scripts/w2v-bert

          d=sherpa-onnx-w2v-bert-ctc-gl-int8-2026-11-20
          mkdir -p $d/test_wavs

          cp -v model.int8.onnx tokens.txt README.md $d
          cp -v *.wav transcript.txt $d/test_wavs/

          tar cjvf $d.tar.bz2 $d

          ls -lh $d
          ls -lh *.tar.bz2

          mv $d ../..
          mv $d.tar.bz2 ../..

      # The fp32 weights are over GitHub's 2 GB limit for a release asset,
      # so only the int8 model is released here; both go to Hugging Face.
      - name: Release
        if: github.event_name == 'workflow_dispatch' && (github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: ./*.tar.bz2
          overwrite: true
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: asr-models

      - name: Publish to huggingface
        if: github.event_name == 'workflow_dispatch' && (github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          timeout_seconds: 200
          shell: bash
          command: |
            # Fail on any error, so a failed push is retried.
            set -e
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            names=(
             sherpa-onnx-w2v-bert-ctc-gl-2026-11-20
             sherpa-onnx-w2v-bert-ctc-gl-int8-2026-11-20
            )
            for d in ${names[@]}; do
              if [ ! -d $d ]; then
                echo "$d does not exist - skip it"
                continue;
              fi

              export GIT_LFS_SKIP_SMUDGE=1
              export GIT_CLONE_PROTECTION_ACTIVE=false
              rm -rf huggingface
              git clone https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/$d huggingface
              cp -av $d/* ./huggingface
              cd huggingface
              git lfs track "*.onnx"
              git lfs track "*.weights"
              git lfs track "*.wav"
              git status
              git add .
              git status
              # A retry after a push that succeeded has nothing to commit.
              git diff --cached --quiet || git commit -m "add models"
              git push https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/$d main
              cd ..
            done
