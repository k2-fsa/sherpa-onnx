name: test-spm

on:
  push:
    branches:
      - master
      - test-spm
  workflow_dispatch:

jobs:
  test-local-spm-macos:
    name: Test local SPM (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run local package (macOS)
        shell: bash
        run: |
          cd spm-examples/macOS
          # Use local package for CI testing
          sed -i.bak 's|.package(url: "https://github.com/k2-fsa/sherpa-onnx", exact: "1.13.7")|.package(path: "../../")|' Package.swift
          git diff
          cat Package.swift
          rm -rf .build
          swift package resolve
          swift package show-dependencies
          swift build --verbose
          swift run SherpaOnnxExample

  test-remote-spm-macos:
    name: Test remote SPM (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run remote package (macOS)
        shell: bash
        run: |
          cd spm-examples/macOS
          rm -rf .build
          swift package resolve
          swift package show-dependencies
          swift build --verbose
          swift run SherpaOnnxExample

  test-local-spm-ios:
    name: Test local SPM (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run local package (iOS)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          # Use local package for CI testing
          sed -i.bak 's|.package(url: "https://github.com/k2-fsa/sherpa-onnx", exact: "1.13.7")|.package(path: "../../")|' Package.swift
          git diff
          cat Package.swift

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme SherpaOnnxExample \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -verbose \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/SherpaOnnxExample" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"

  test-remote-spm-ios:
    name: Test remote SPM (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run remote package (iOS)
        shell: bash
        run: |
          set -euo pipefail
          cd spm-examples/iOS

          echo "=== Resolving ==="
          swift package resolve

          echo "=== Building for iOS Simulator ==="
          xcodebuild -scheme SherpaOnnxExample \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -verbose \
            build 2>&1

          echo "=== Finding built executable ==="
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*-iphonesimulator/SherpaOnnxExample" -type f | head -1)
          echo "Binary: $BINARY"

          echo "=== Booting iOS Simulator ==="
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for key in devices:
              for d in devices[key]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          echo "=== Running on iOS Simulator ==="
          xcrun simctl spawn "$DEVICE" "$BINARY"
