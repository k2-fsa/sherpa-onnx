name: export-nemotron-labs-unified-asr-0.6b

on:
  workflow_dispatch:

concurrency:
  group: export-nemotron-labs-unified-asr-0.6b-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_ENABLE_HF_TRANSFER: "0"

jobs:
  export:
    if: github.repository_owner == 'k2-fsa' || github.repository_owner == 'csukuangfj'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        left_context: [70, 37]
    steps:
      - uses: actions/checkout@v4
      - name: Show disk space
        run: df -h
      # Free simulator data on macOS runners before installing NeMo.
      - name: Free up disk space
        run: |
          xcrun simctl delete all
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
      - name: Show disk space
        run: df -h
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime test dependencies
        run: pip install onnx numpy soundfile
      - name: Build streaming CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF -DSHERPA_ONNX_ENABLE_TTS=OFF \
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF -DSHERPA_ONNX_ENABLE_PYTHON=ON
          cmake --build build --target sherpa-onnx _sherpa_onnx -j 3
      - name: Test runtime with deterministic models
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/sherpa-onnx/python:$GITHUB_WORKSPACE/build/lib" \
            python sherpa-onnx/python/tests/test_online_unified_recognizer.py
      - name: Run
        shell: bash
        run: |
          cd scripts/nemo/nemotron-labs-unified-asr-0.6b/
          ./run.sh ${{ matrix.left_context }}
          mv -v *.tar.bz2 ../../../
          mv -v sherpa-onnx-nemotron-labs-unified-asr-*/ ../../../

      - name: Publish to huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            m=sherpa-onnx-nemotron-labs-unified-asr-0.6b-int8-streaming-1120ms-L${{ matrix.left_context }}
            rm -rf huggingface
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false
            git clone https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/$m huggingface
            cp -av $m/* huggingface
            cd huggingface
            git lfs track "*.onnx"
            git lfs track "*.wav"
            git lfs track "*.weights"
            git status
            git add .
            git status
            git commit -m "first commit"
            git push https://csukuangfj2:$HF_TOKEN@huggingface.co/csukuangfj2/$m main

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: ./*.tar.bz2
          overwrite: true
          repo_name: k2-fsa/sherpa-onnx
          repo_token: ${{ secrets.UPLOAD_GH_SHERPA_ONNX_TOKEN }}
          tag: asr-models
