name: ascend

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: ascend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ascend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # - image: "quay.io/ascend/cann:8.0.0-910b-ubuntu22.04-py3.9"
          #   name: "8.0.0-910b"
          - image: "quay.io/ascend/cann:8.0.rc1-310p-ubuntu20.04-py3.9"
            name: "8.0.rc1-310p"
    container:
      # The gpustack/* images on Docker Hub are gone ("the image is not on
      # docker now"); use the official quay.io/ascend/cann images instead.
      # Tags: https://quay.io/repository/ascend/cann?tab=tags
      #        https://github.com/Ascend/cann-container-image/blob/main/supported_tags.md
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update && apt-get install -y git curl cmake gcc g++

      - name: Show GCC version
        shell: bash
        run: |
          gcc --version
          g++ --version
          which gcc
          which g++

      - name: Build sherpa-onnx
        shell: bash
        run: |
          ls -lh /usr/local/Ascend/ascend-toolkit/set_env.sh
          find /usr/local/Ascend -name "libascend*.so" 2>/dev/null
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/x86_64-linux/devlib/linux/x86_64:$LD_LIBRARY_PATH

          mkdir build
          cd build
          cmake -DSHERPA_ONNX_ENABLE_ASCEND_NPU=ON ..

          make -j2

      - name: Show results
        shell: bash
        run: |
          cd build

          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/x86_64-linux/devlib/linux/x86_64:$LD_LIBRARY_PATH

          ldd ./bin/sherpa-onnx-offline
