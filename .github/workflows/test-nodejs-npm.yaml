name: test-nodejs-npm

on:
  workflow_dispatch:

concurrency:
  group: test-nodejs-npm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-nodejs-npm:
    if: github.repository_owner == 'csukuangfj' || github.repository_owner == 'k2-fsa'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Display node version
        shell: bash
        run: |
          node --version
          npm --version

      - name: Run tests
        shell: bash
        run: |
          node --version
          npm --version

          export d=nodejs-examples
          ./.github/scripts/test-nodejs-npm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tts-waves-${{ matrix.os }}-${{ matrix.node-version }}
          # all TTS outputs: *-lexicon.wav, *-phonemize.wav, plus the
          # own-frontend models (test-pocket-en.wav, test-supertonic-*.wav)
          path: nodejs-examples/test-*.wav
          if-no-files-found: warn
