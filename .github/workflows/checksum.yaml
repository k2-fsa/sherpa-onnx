name: Create checksum

on:
  schedule:
    - cron: "0 1 * * *" # Runs at 1:00 AM UTC daily
  workflow_dispatch:

jobs:
  checksum:
    if: github.repository_owner == 'k2-fsa'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [null, asr-models, tts-models, kws-models, speaker-recongition-models, audio-tagging-models, punctuation-models, source-separation-models, fa-models, asr-models-qnn, asr-models-qnn-2, asr-models-qnn-3, asr-models-qnn-binary, asr-models-qnn-binary-2, asr-models-qnn-binary-3]
    steps:
      - name: Run checksum action
        # Pin by commit SHA: this job uploads release assets with GITHUB_TOKEN write access.
        uses: XDcobra/checksum@30233e2332b2f744b8bcf1a2bf399503739a6b80 # v1.1.1
        with:
          tag: ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
