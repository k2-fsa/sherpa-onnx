name: Create checksum

on:
  schedule:
    - cron: "0 1 * * *" # Runs at 1:00 AM UTC daily
  workflow_dispatch:

jobs:
  checksum:
    if: github.repository_owner == 'k2-fsa'
    runs-on: macos-latest
    strategy:
      matrix:
        tag: [null, asr-models, tts-models, kws-models, speaker-recongition-models, audio-tagging-models, punctuation-models, source-separation-models, fa-models]
    steps:
      - name: Run checksum action
        # Pin by commit SHA: this job uploads release assets with GITHUB_TOKEN write access.
        uses: XDcobra/checksum@672d1f6e3d3c6e2fd68329f450923e84755fdc47 # v1.0.1
        with:
          tag: ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
